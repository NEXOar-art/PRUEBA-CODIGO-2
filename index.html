<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subasta Privada Live</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0f172a; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .auction-card { background: #1e293b; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); text-align: center; width: 350px; }
        .price-display { font-size: 2.5rem; font-weight: bold; margin: 20px 0; transition: text-shadow 0.3s ease; }
        .glow { text-shadow: 0 0 20px #10b981; color: #10b981; }
        .btn-bid { background: #3b82f6; color: white; border: none; padding: 15px 30px; font-size: 1.2rem; border-radius: 8px; cursor: pointer; transition: transform 0.1s, background 0.3s; width: 100%; font-weight: bold;}
        .btn-bid:hover { background: #2563eb; transform: scale(1.02); }
        .btn-bid:active { transform: scale(0.95); }
        .timer { font-size: 1.2rem; color: #f59e0b; margin-bottom: 20px; }
        @keyframes pulse { 0% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.05); opacity: 0.8; } 100% { transform: scale(1); opacity: 1; } }
        .urgent { color: #ef4444; animation: pulse 1s infinite; font-weight: bold; }
    </style>
</head>
<body>

<div class="auction-card">
    <h2>Subasta #001</h2>
    <div class="timer" id="timer">Tiempo restante: 00:45</div>
    <div class="price-display" id="currentPrice">$ 100,000</div>
    <button class="btn-bid" onclick="placeBid()">Pujar +$5,000</button>
</div>

<script>
    // Conexión al WebSocket de FastAPI
    const ws = new WebSocket("ws://localhost:8000/ws/auction/1");
    let currentPrice = 0;
    const priceDisplay = document.getElementById("currentPrice");

    ws.onmessage = function(event) {
        const data = JSON.parse(event.data);
        if (data.type === "init" || data.type === "new_bid") {
            currentPrice = data.price;
            priceDisplay.innerText = "$ " + currentPrice.toLocaleString();
            
            // Microefecto de destello (Glow)
            priceDisplay.classList.add("glow");
            setTimeout(() => priceDisplay.classList.remove("glow"), 500);
        }
    };

    function placeBid() {
        const newBid = currentPrice + 5000; // Incremento fijo de ejemplo
        ws.send(JSON.stringify({ user: "User123", amount: newBid }));
    }

    // Simulación de cronómetro con microefecto de urgencia
    let timeLeft = 45;
    setInterval(() => {
        timeLeft--;
        const timerEl = document.getElementById("timer");
        timerEl.innerText = `Tiempo restante: 00:${timeLeft < 10 ? '0'+timeLeft : timeLeft}`;
        if (timeLeft <= 10 && timeLeft > 0) {
            timerEl.classList.add("urgent");
        } else if (timeLeft <= 0) {
            timerEl.innerText = "SUBASTA CERRADA";
            timerEl.classList.remove("urgent");
            document.querySelector(".btn-bid").disabled = true;
        }
    }, 1000);
</script>

</body>
</html>
